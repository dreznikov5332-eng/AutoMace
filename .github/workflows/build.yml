name: build
on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: checkout repository
        uses: actions/checkout@v6
      - name: unpack project
        run: |
          mkdir unpacked
          unzip -q ./*.zip -d unpacked
          ls unpacked
      - name: setup jdk
        uses: actions/setup-java@v5
        with:
          java-version: '21'
          distribution: 'microsoft'
      - name: setup gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '9.8.2'
      - name: build
        working-directory: unpacked/automace
        run: gradle build
      - name: capture build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: automace-mod
          path: unpacked/automace/build/libs/
